name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        run: python3 scripts/generate_xcodeproj.py

      - name: Prepare build dir
        run: mkdir -p build

      - name: Build & archive (no codesign)
        run: |
          set -o pipefail
          xcodebuild \
            -project FastDrop.xcodeproj \
            -scheme FastDrop \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/FastDrop.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build/xcodebuild.log || { echo "Build failed"; exit 1; }

      - name: Create unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/FastDrop.xcarchive/Products/Applications/FastDrop.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../FastDrop-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-unsigned-ipa
          path: build/FastDrop-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
