name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Sanitize project.pbxproj
        run: |
          python3 -c '
          p = "FastDrop.xcodeproj/project.pbxproj"
          raw = open(p, "rb").read()
          text = raw.decode("utf-8-sig").lstrip()
          open(p, "w", encoding="utf-8", newline="\n").write(text)
          '
          head -n 5 FastDrop.xcodeproj/project.pbxproj

      - name: Build for iOS (no codesign)
        run: |
          xcodebuild \
            -project FastDrop.xcodeproj \
            -scheme FastDrop \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/FastDrop.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Create unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/FastDrop.xcarchive/Products/Applications/FastDrop.app build/ipa/Payload/
          cd build/ipa && zip -r ../FastDrop-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-unsigned-ipa
          path: build/FastDrop-unsigned.ipa
