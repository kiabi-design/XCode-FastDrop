name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      sign_for_device:
        description: 'Sign IPA for device installation (requires Apple Developer secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16 (iOS 18 SDK)
        run: |
          # macos-15 comes with Xcode 16.x
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || true
          xcodebuild -version

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos metal --version

      - name: Generate Xcode project
        run: python3 scripts/generate_xcodeproj.py

      - name: Prepare build directory
        run: mkdir -p build

      # ──────────────────────────────────────────────────────────────
      # CODE SIGNING SETUP (for device installation)
      # ──────────────────────────────────────────────────────────────
      - name: Import certificate (if provided)
        if: ${{ github.event.inputs.sign_for_device == 'true' || env.SIGN_FOR_DEVICE == 'true' }}
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$CERT_BASE64" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Missing code signing secrets. Set APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_PROVISIONING_PROFILE_BASE64 in repository settings > Secrets > Actions"
            exit 1
          fi

          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -l "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Install provisioning profile
          echo "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

          # Extract UUID and Team ID from profile for xcodebuild
          PROFILE_UUID=$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision" 2>/dev/null | plutil -extract UUID xml1 -o - - 2>/dev/null | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          TEAM_ID=$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision" 2>/dev/null | plutil -extract TeamIdentifier xml1 -o - - 2>/dev/null | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p' | head -1)

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Verify Metal compilation
        run: |
          # Verify .metal files are properly included
          xcodebuild -project FastDrop.xcodeproj -scheme FastDrop -showBuildSettings | grep -i metal || true

      # ──────────────────────────────────────────────────────────────
      # BUILD & ARCHIVE
      # ──────────────────────────────────────────────────────────────
      - name: Build & archive
        env:
          SIGN_FOR_DEVICE: ${{ github.event.inputs.sign_for_device == 'true' }}
          PROFILE_UUID: ${{ env.PROFILE_UUID }}
          TEAM_ID: ${{ env.TEAM_ID }}
        run: |
          set -o pipefail

          if [ "$SIGN_FOR_DEVICE" = "true" ] && [ -n "$PROFILE_UUID" ] && [ -n "$TEAM_ID" ]; then
            echo "Building SIGNED for device..."
            xcodebuild \
              -project FastDrop.xcodeproj \
              -scheme FastDrop \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/FastDrop.xcarchive \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="iPhone Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              archive 2>&1 | tee build/xcodebuild.log
          else
            echo "Building UNSIGNED (simulator/test only)..."
            xcodebuild \
              -project FastDrop.xcodeproj \
              -scheme FastDrop \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/FastDrop.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive 2>&1 | tee build/xcodebuild.log
          fi

      - name: Verify archive contains Metal shaders
        run: |
          if [ -d "build/FastDrop.xcarchive/Products/Applications/FastDrop.app" ]; then
            echo "App bundle found"
            find "build/FastDrop.xcarchive/Products/Applications/FastDrop.app" -name "*.metallib" -o -name "default.metallib" | head -5
            echo "Metal libraries in bundle:"
            ls -la "build/FastDrop.xcarchive/Products/Applications/FastDrop.app/" | head -20
          else
            echo "::error::Archive not found"
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────
      # EXPORT IPA
      # ──────────────────────────────────────────────────────────────
      - name: Create export options
        if: ${{ github.event.inputs.sign_for_device == 'true' }}
        env:
          PROFILE_UUID: ${{ env.PROFILE_UUID }}
          TEAM_ID: ${{ env.TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.fastdrop</key>
                  <string>$PROFILE_UUID</string>
              </dict>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          cat build/ExportOptions.plist

      - name: Create export options (unsigned)
        if: ${{ github.event.inputs.sign_for_device != 'true' }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.sign_for_device }}" = "true" ]; then
            xcodebuild -exportArchive \
              -archivePath build/FastDrop.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist build/ExportOptions.plist \
              2>&1 | tee -a build/xcodebuild.log
          else
            # For unsigned, just package the .app directly
            mkdir -p build/export/FastDrop.ipa/Payload
            cp -R build/FastDrop.xcarchive/Products/Applications/FastDrop.app build/export/FastDrop.ipa/Payload/
            cd build/export/FastDrop.ipa
            zip -qry ../FastDrop-unsigned.ipa Payload
          fi

      - name: Upload signed IPA
        if: ${{ github.event.inputs.sign_for_device == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-signed-ipa
          path: build/export/FastDrop.ipa
          if-no-files-found: error

      - name: Upload unsigned IPA
        if: ${{ github.event.inputs.sign_for_device != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: FastDrop-unsigned-ipa
          path: build/export/FastDrop-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore